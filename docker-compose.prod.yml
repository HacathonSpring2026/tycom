services:
  db: # 本番環境ではいらない
    image: mysql:8.0
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    env_file:
      - .env.prod

  django-web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: always
    depends_on:
      - db
    env_file:
      - .env.prod
    volumes:
      - socket-volume:/var/run/gunicorn
      - static-volume:/app/staticfiles

  nginx:
    image: nginx:latest
    ports:
      - '80:80'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - socket-volume:/var/run/gunicorn
      - static-volume:/app/staticfiles
    environment:
      - DOMAINS=${DOMAINS}
    depends_on:
      - django-web
  
volumes:
  mysql_data: # 本番環境ではいらない
  socket-volume:
  static-volume: