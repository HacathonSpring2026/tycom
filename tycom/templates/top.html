<!DOCTYPE html>
<html>
<head>
    <title>ステージ選択</title>
</head>
<body>
    <h1>カテゴリーを選んでください</h1>

    <form method="POST">
        {% csrf_token %}
        {% for category in category_list %}
            <button type="submit" name="category_id" value="{{ category.id }}">
                {{ category.category_name }}
            </button>
        {% endfor %}
    </form>
</body>
</html>
